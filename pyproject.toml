[project]
name = "icloud-drop"
version = "1.0.0"
description = "iCloudの写真と動画を、Windowsのフォルダへドラッグして保存する個人用アプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10",
]

[project.optional-dependencies]
icloud = [
    "icloudpd>=1.33.0",
    "pillow-heif>=0.16.0",
]
keyring = [
    "keyring>=25",
]
dev = [
    "pytest>=8",
]

[project.scripts]
icloud-drop = "icloud_drop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
